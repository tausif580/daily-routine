<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Daily Routine</title>
<style>
:root{--bg:#f2f4f8;--card:#ffffff;--tx:#0f172a;--mut:#64748b;--ac:#10b981;--ac2:#0ea5e9;--bad:#ef4444;--bd:rgba(15,23,42,.08);--seg:rgba(15,23,42,.06);--sh:0 6px 24px rgba(15,23,42,.07);--glow:rgba(16,185,129,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07090d;--card:#12161e;--tx:#eef2f7;--mut:#8b95a5;--bd:rgba(255,255,255,.07);--seg:rgba(255,255,255,.06);--sh:0 8px 28px rgba(0,0,0,.5);--glow:rgba(16,185,129,.14)}}
:root[data-theme="dark"]{--bg:#07090d;--card:#12161e;--tx:#eef2f7;--mut:#8b95a5;--bd:rgba(255,255,255,.07);--seg:rgba(255,255,255,.06);--sh:0 8px 28px rgba(0,0,0,.5);--glow:rgba(16,185,129,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(900px 380px at 50% -120px,var(--glow),transparent 70%),var(--bg);background-attachment:fixed;color:var(--tx);font-family:"Inter",system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;padding-bottom:150px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;transition:transform .12s ease,background .2s,box-shadow .2s}
button:active{transform:scale(.96)}
header{padding:18px 14px 6px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 18px rgba(16,185,129,.35)}
h1{font-size:21px;margin:0;letter-spacing:-.3px;font-weight:700}
.sub{color:var(--mut);font-size:12.5px;margin-top:2px}
.tabs{display:flex;gap:4px;background:var(--seg);padding:4px;border-radius:15px;margin-bottom:12px}
.tab{flex:1;background:transparent;color:var(--mut);border:0;border-radius:11px;padding:10px 4px;font-size:13px;font-weight:600}
.tab.on{background:var(--card);color:var(--tx);box-shadow:0 2px 10px rgba(0,0,0,.14)}
.dates{display:flex;gap:8px;align-items:center}
.dates button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 15px;font-size:17px;box-shadow:var(--sh)}
.dates input{flex:1;min-width:0;font-size:15px;font-weight:600;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);text-align:center;box-shadow:var(--sh)}
.hint{font-size:12px;color:var(--mut);padding:8px 16px 2px}
.list{padding:8px 12px}
.row{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 13px;margin-bottom:9px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.info{flex:1;min-width:0}
.t{font-size:11.5px;color:var(--mut);font-weight:600;letter-spacing:.2px}
.n{font-size:15px;line-height:1.3;margin-top:2px;font-weight:500}
.in{width:86px;text-align:center}
.in input{width:100%;font-size:18px;font-weight:700;padding:10px 6px;border-radius:12px;border:1.5px solid var(--bd);background:var(--seg);color:var(--tx);text-align:center;outline:none;transition:border .2s,box-shadow .2s}
.in input:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--glow)}
.in input.over{border-color:var(--bad);box-shadow:0 0 0 4px rgba(239,68,68,.14)}
.in input.full{border-color:var(--ac);background:rgba(16,185,129,.12);color:var(--ac)}
.max{font-size:10.5px;color:var(--mut);margin-top:4px}
.val{font-size:11px;color:var(--ac);margin-top:2px;min-height:13px;font-weight:600}
.bar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--bd);border-radius:22px;padding:10px 12px 10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.28);z-index:10}
.ring{width:58px;height:58px;transform:rotate(-90deg);flex:none}
.rb{fill:none;stroke:var(--seg);stroke-width:4.5}
.rf{fill:none;stroke:url(#rg);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:119.38;stroke-dashoffset:119.38;transition:stroke-dashoffset .5s ease}
.bt{flex:1;min-width:0}
.lbl{font-size:11.5px;color:var(--mut);font-weight:600}
.tot{font-size:28px;font-weight:800;line-height:1.1;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tot small{font-size:14px;color:var(--mut);-webkit-text-fill-color:var(--mut);font-weight:600}
.msg{font-size:11.5px;color:var(--mut);margin-top:1px}
.reset{background:rgba(239,68,68,.12);color:var(--bad);border:1px solid rgba(239,68,68,.25);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 12px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.st b{display:block;font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.st span{font-size:12px;color:var(--mut);font-weight:500}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;margin:10px 12px;padding:14px;box-shadow:var(--sh);animation:up .35s ease both}
.card h2{font-size:12px;margin:0 0 12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.7px}
.chart{display:flex;align-items:flex-end;gap:5px;height:130px;border-bottom:1px solid var(--bd)}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.col i{display:block;width:100%;background:linear-gradient(180deg,var(--ac2),var(--ac));border-radius:6px 6px 2px 2px;min-height:3px}
.col em{font-style:normal;font-size:9px;color:var(--mut);margin-bottom:3px;font-weight:600}
.xl{display:flex;gap:5px;margin-top:4px}
.xl span{flex:1;text-align:center;font-size:9.5px;color:var(--mut)}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--bd)}
.hrow:first-of-type{border-top:0}
.hrow .d{flex:1;font-size:14.5px;font-weight:500}
.hrow .d small{display:block;color:var(--mut);font-size:11.5px;margin:2px 0 1px;font-weight:400}
.hrow .s{font-size:20px;font-weight:800}
.hrow .pb{height:6px;border-radius:3px;background:var(--seg);margin-top:6px;overflow:hidden}
.hrow .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:3px}
.hrow button{background:var(--seg);border:0;color:var(--tx);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:600}
.empty{color:var(--mut);text-align:center;padding:40px 14px;font-size:14px;line-height:1.6}
.hidden{display:none}
.sbtn{background:var(--seg);color:var(--tx);border:0;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600}
.sbtn.ok{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.3)}
.sbtn.dng{background:var(--bad);color:#fff}
.tin{width:100%;font-size:15px;padding:11px;border-radius:12px;border:1.5px solid var(--bd);background:var(--seg);color:var(--tx);font-family:inherit;outline:none}
.tin:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--glow)}
.big{font-size:24px;font-weight:800;margin-top:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.big small{font-size:14px;-webkit-text-fill-color:var(--mut);color:var(--mut);font-weight:600}
.big.bad{background:none;color:var(--bad);-webkit-text-fill-color:var(--bad);font-size:15px;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--bd);font-size:14px}
.kv:first-of-type{border-top:0}.kv span{color:var(--mut)}.kv b{font-weight:700}
.pb2{height:12px;border-radius:7px;background:var(--seg);overflow:hidden}
.pb2 i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:7px;transition:width .5s ease}
.trow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.trow .tn{flex:1;min-width:0;font-size:14px}
.trow small{color:var(--mut);font-size:11px}
.cb{width:23px;height:23px;accent-color:var(--ac);flex:none}
.srow{margin-left:22px}
.li{font-size:14px;padding:8px 0;border-top:1px solid var(--bd)}
.li:first-of-type{border-top:0}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:18px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.45);animation:up .2s ease both}
.dlg h3{margin:0 0 12px;font-size:16px;font-weight:700}
.dlg .acts{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
@keyframes rise{from{transform:translateY(64px)}to{transform:none}}
.liq{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes bub{0%{transform:translateY(0);opacity:0}25%{opacity:.8}100%{transform:translateY(-20px);opacity:0}}
.bub{animation:bub 2.8s ease-in infinite}
@keyframes riseb{from{transform:translateY(135px)}to{transform:none}}
.liqb{animation:riseb 1.2s cubic-bezier(.2,.8,.2,1) both}
</style>
</head>
<body>
<header>
<div class="brand"><div class="logo">🎯</div><div><h1>Daily Routine</h1><div class="sub" id="hsub"></div></div><button class="sbtn" id="bk" style="margin-left:auto">💾 Backup</button></div>
<div class="tabs">
 <button class="tab on" id="tEntry">✍️ Entry</button>
 <button class="tab" id="tHist">📊 Performance</button>
 <button class="tab" id="tSyl">📘 Syllabus</button>
</div>
<div class="dates" id="dates">
 <button id="prev">‹</button>
 <input type="date" id="dp">
 <button id="next">›</button>
</div>
</header>

<div id="entry">
 <div class="hint">নম্বর বা হিসাব লিখুন (যেমন: 3+4)। Enter a number or sum like 3+4.</div>
 <div class="list" id="list"></div>
 <div class="bar">
  <svg class="ring" viewBox="0 0 44 44"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><circle class="rb" cx="22" cy="22" r="19"/><circle class="rf" id="rf" cx="22" cy="22" r="19"/></svg>
  <div class="bt"><div class="lbl" id="dlbl">মোট / TOTAL</div><div class="tot"><span id="total">0</span> <small>/ 100</small></div><div class="msg" id="msg"></div></div>
  <button class="reset" id="reset">Clear day</button>
 </div>
</div>

<div id="hist" class="hidden"></div>
<div id="syl" class="hidden"></div>

<script>
var ROWS_OLD=[
["6:00–6:30","Wake up + Freshen up + Fajr",4],
["6:30–9:30","📚 Rooftop Study",18],
["9:30–10:30","Breakfast + Heading to Library + Own Time",2],
["10:30–1:30","📚 Library Study",20],
["1:30–2:00","Zuhr + Lunch",3],
["2:00–3:20","Bath (when necessary) + Sleep",2],
["3:20–5:30","Heading to Library + Library Study",15],
["5:30–6:30","Asr + Maghrib + Own Time",5],
["6:30–9:30","📚 Library Study",18],
["9:30–10:30","Dinner + Isha + Necessary/Own Time",3],
["10:30–11:30","Revision for Exam",3],
["11:30–1:30","Exam Preparation",5],
["1:30–6:00","Sleep + Phone + Recovery (if needed)",2]
];
var ROWS_NEW=[
["6:00–6:30","Wake up + Freshen up + Fajr",4],
["6:30–9:30","📚 Study",15],
["9:30–10:30","Breakfast + Own Time",2],
["10:30–1:30","📚 Library Study",15],
["1:30–2:30","Zuhr + Lunch + Rest",4],
["2:30–5:30","📚 Library Study",15],
["5:30–6:00","Asr + Maghrib + Own Time",4],
["6:00–10:00","📚 Library Study",21],
["10:00–11:00","Dinner + Isha + Necessary/Own Time",3],
["11:00–2:00","📚 Library Study",15],
["2:00–6:00","Sleep",2]
];
var NEW_FROM='2026-10-13';
function rowsFor(d){return d>=NEW_FROM?ROWS_NEW:ROWS_OLD}
var rows=ROWS_OLD;
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
var todayStr=ymd(new Date());
document.getElementById('hsub').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})+' · v9';
var cur=todayStr;
var db={};
try{
 db=JSON.parse(localStorage.getItem('mc100v2')||'{}');
 if(!Object.keys(db).length){
  var old=JSON.parse(localStorage.getItem('mc100')||'null');
  if(old&&old.day&&old.v&&Object.keys(old.v).length)db[old.day]=old.v;
 }
}catch(e){db={}}
function save(){try{localStorage.setItem('mc100v2',JSON.stringify(db));}catch(e){}}

function calc(t){
 t=String(t||'').replace(/[×x]/g,'*').replace(/÷/g,'/').replace(/,/g,'.').replace(/\s+/g,'');
 var bn='০১২৩৪৫৬৭৮৯';t=t.replace(/[০-৯]/g,function(c){return bn.indexOf(c)});
 if(!t)return 0;
 if(!/^[0-9+\-*\/().]+$/.test(t))return NaN;
 try{var r=Function('"use strict";return ('+t+')')();return isFinite(r)?r:NaN;}catch(e){return NaN;}
}
function fmt(n){return Math.round(n*100)/100}
function dayTotal(v,d){var s=0;rowsFor(d||cur).forEach(function(r,i){var x=calc(v&&v[i]);if(!isNaN(x))s+=x});return s}
function hasData(v){return v&&Object.keys(v).some(function(k){return String(v[k]).trim()!==''})}
function pretty(s){return parse(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}

var list=document.getElementById('list'),inputs=[];
function buildList(){
list.innerHTML='';inputs=[];
rows.forEach(function(r,i){
 var d=document.createElement('div');d.className='row';
 d.innerHTML='<div class="info"><div class="t">'+r[0]+'</div><div class="n">'+r[1]+'</div></div><div class="in"><input autocomplete="off" placeholder="0"><div class="max">max '+r[2]+'</div><div class="val"></div></div>';
 list.appendChild(d);
 var el=d.querySelector('input');inputs.push({el:el,val:d.querySelector('.val')});
 el.addEventListener('input',function(){
  if(!db[cur])db[cur]={};
  db[cur][i]=el.value;
  if(!hasData(db[cur]))delete db[cur];
  save();update();
 });
});
}
function load(){
 var r2=rowsFor(cur);if(rows!==r2||!inputs.length){rows=r2;buildList()}
 var v=db[cur]||{};
 inputs.forEach(function(o,i){o.el.value=v[i]||''});
 document.getElementById('dp').value=cur;
 update();
}
function update(){
 var sum=0;
 rows.forEach(function(r,i){
  var o=inputs[i],x=calc(o.el.value);
  if(isNaN(x)){o.val.textContent='?';o.el.classList.add('over');return}
  o.el.classList.toggle('over',x>r[2]);o.el.classList.toggle('full',x>0&&x<=r[2]&&x>=r[2]);
  var t=o.el.value.trim();
  o.val.textContent=(t&&/[^0-9.]/.test(t))?'= '+fmt(x):'';
  sum+=x;
 });
 document.getElementById('total').textContent=fmt(sum);
 document.getElementById('rf').style.strokeDashoffset=119.38*(1-Math.max(0,Math.min(100,sum))/100);
 document.getElementById('msg').textContent=sum>=90?'Outstanding 🔥':sum>=75?'Great day 💪':sum>=50?'Good, keep pushing':sum>0?'Keep going':'Start your day';
 document.getElementById('dlbl').textContent=(cur===todayStr?'আজ / TODAY':pretty(cur));
}
function go(s){cur=s;load()}
document.getElementById('dp').addEventListener('change',function(e){if(e.target.value)go(e.target.value)});
document.getElementById('prev').onclick=function(){var d=parse(cur);d.setDate(d.getDate()-1);go(ymd(d))};
document.getElementById('next').onclick=function(){var d=parse(cur);d.setDate(d.getDate()+1);go(ymd(d))};
document.getElementById('reset').onclick=function(){
 if(!confirm('এই দিনের সব মুছবেন? Clear this day?'))return;
 delete db[cur];save();load();
};

function renderHist(){
 var h=document.getElementById('hist');
 var days=Object.keys(db).filter(function(k){return hasData(db[k])}).sort();
 if(!days.length){h.innerHTML='<div class="empty">এখনও কোনো ডেটা নেই।<br>No data yet — add marks in Entry.</div>';return}
 var tots=days.map(function(k){return dayTotal(db[k],k)});
 var sum=tots.reduce(function(a,b){return a+b},0);
 var avg=sum/days.length;
 var bi=0;tots.forEach(function(t,i){if(t>tots[bi])bi=i});
 var l7=days.filter(function(k){return (parse(todayStr)-parse(k))/864e5<7});
 var a7=l7.length?l7.reduce(function(a,k){return a+dayTotal(db[k],k)},0)/l7.length:0;
 var html='<div class="stats">'+
  '<div class="st"><b>'+fmt(avg)+'</b><span>Average / গড়</span></div>'+
  '<div class="st"><b>'+fmt(tots[bi])+'</b><span>Best day · '+parse(days[bi]).getDate()+'/'+(parse(days[bi]).getMonth()+1)+'</span></div>'+
  '<div class="st"><b>'+days.length+'</b><span>Days recorded</span></div>'+
  '<div class="st"><b>'+(l7.length?fmt(a7):'–')+'</b><span>Last 7 days avg</span></div></div>';
 var last=days.slice(-14),ht='',xl='';
 last.forEach(function(k){
  var t=dayTotal(db[k],k);
  ht+='<div class="col"><em>'+fmt(t)+'</em><i style="height:'+Math.min(100,t)*0.85+'%"></i></div>';
  xl+='<span>'+parse(k).getDate()+'</span>';
 });
 html+='<div class="card"><h2>Last '+last.length+' days</h2><div class="chart">'+ht+'</div><div class="xl">'+xl+'</div></div>';
 // per-slot average
function slotCard(title,rws,ds){
  if(!ds.length)return '';
  var sl='';
  rws.forEach(function(r,i){
   var s=0;ds.forEach(function(k){var x=calc(db[k]&&db[k][i]);if(!isNaN(x))s+=x});
   var a=s/ds.length,p=Math.min(100,a/r[2]*100);
   sl+='<div class="hrow"><div class="d"><small>'+r[0]+'</small>'+r[1]+'<div class="pb"><i style="width:'+p+'%"></i></div></div><div class="s" style="font-size:15px">'+fmt(a)+'<small style="color:var(--mut);font-weight:400"> /'+r[2]+'</small></div></div>';
  });
  return '<div class="card"><h2>'+title+'</h2>'+sl+'</div>';
 }
 html+=slotCard('Slot-wise average · current routine',ROWS_NEW,days.filter(function(k){return k>=NEW_FROM}))+slotCard('Slot-wise average · previous routine',ROWS_OLD,days.filter(function(k){return k<NEW_FROM}));
 var dl='';
 days.slice().reverse().forEach(function(k){
  var t=dayTotal(db[k],k);
  dl+='<div class="hrow" data-d="'+k+'"><div class="d"><small>'+pretty(k)+'</small><div class="pb"><i style="width:'+Math.min(100,t)+'%"></i></div></div><div class="s">'+fmt(t)+'</div><button data-open="'+k+'">Open</button></div>';
 });
 html+='<div class="card"><h2>Date-wise result / তারিখ অনুযায়ী</h2>'+dl+'</div>';
 h.innerHTML=html;
 h.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){cur=b.getAttribute('data-open');show('entry')}});
}
function show(w){
 var e=w==='entry';
 document.getElementById('entry').classList.toggle('hidden',!e);
 document.getElementById('hist').classList.toggle('hidden',e);
 document.getElementById('dates').classList.toggle('hidden',!e);
 document.getElementById('tEntry').classList.toggle('on',e);
 document.getElementById('tHist').classList.toggle('on',!e);
 if(e)load();else renderHist();
 window.scrollTo(0,0);
}
document.getElementById('tEntry').onclick=function(){show('entry')};
document.getElementById('tHist').onclick=function(){show('hist')};
load();
</script>
<script>
(function(){
var K='mc100syl';
var S={deadline:'',subjects:[]};

function doPreset(){
 var added=0;
 PRESET.forEach(function(p){
  var s=S.subjects.filter(function(q){return q.name.trim().toLowerCase()===p[0].toLowerCase()})[0];
  if(!s){s={id:uid(),name:p[0],topics:[]};S.subjects.push(s)}

function dlg(o){

 d.querySelector('h3').textContent=o.title;
 d.querySelector('#dok').textContent=o.ok||'OK';
 var inp=d.querySelector('#dv');if(inp){inp.value=o.value||'';if(o.ph)inp.placeholder=o.ph}
 function close(){document.body.removeChild(d)}
 d.querySelector('#dc').onclick=close;

function leafList(t){return (t.subs&&t.subs.length)?t.subs:[t]}
function leaves(){var a=[];S.subjects.forEach(function(s){s.topics.forEach(function(t){leafList(t).forEach(function(x){a.push({it:x,s:s,t:t})})})});return a}
function findS(id){return S.subjects.filter(function(s){return s.id===id})[0]}
function findT(s,id){return s.topics.filter(function(t){return t.id===id})[0]}
function findU(t,id){return t.subs.filter(function(u){return u.id===id})[0]}
function dayDiff(a,b){return Math.round((parse(a)-parse(b))/864e5)}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function lname(l){return l.s.name+' — '+(l.it===l.t?l.t.name:l.t.name+' › '+l.it.name)}

function pProg(){
 var L=leaves(),total=L.length,done=L.filter(function(l){return l.it.done}).length,rem=total-done;
 var pct=total?Math.round(done/total*100):0;
 var dl=S.deadline?dayDiff(S.deadline,todayStr):null;
 var h='<div class="card"><h2>Deadline</h2><div style="display:flex;gap:8px"><input type="date" id="sdl" value="'+esc(S.deadline)+'" style="flex:1;min-width:0;font-size:16px;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)">'+(S.deadline?'<button class="sbtn" data-a="cldl">Clear</button>':'')+'</div>';
 if(dl===null)h+='<div class="hint" style="padding:8px 0 0">Set a date to finish the whole syllabus. You can change it any time.</div>';
 else if(dl<0)h+='<div class="big bad">Deadline passed '+(-dl)+' day'+(dl===-1?'':'s')+' ago</div>';
 else if(dl===0)h+='<div class="big bad">Deadline is today</div>';
 else h+='<div class="big">'+dl+' <small>day'+(dl===1?'':'s')+' left</small></div>';
 h+='</div>';
 if(!total){return h+'<div class="empty">No topics yet. Open the Topics tab to add subjects and topics, or load the ready-made syllabus there.</div>'}
 h+='<div class="stats"><div class="st"><b>'+done+'</b><span>Done</span></div><div class="st"><b>'+rem+'</b><span>Remaining</span></div><div class="st"><b>'+pct+'%</b><span>Completed</span></div><div class="st"><b>'+total+'</b><span>Total items</span></div></div>';
 h+='<div class="card"><div class="pb2"><i style="width:'+pct+'%"></i></div><div class="hint" style="padding:6px 0 0">Items = topics, or their subtopics when a topic has subtopics.</div></div>';
 var dd=L.filter(function(l){return l.it.done}).map(function(l){return l.it.done}).sort();
 var cur=0,win=7;
 if(dd.length){
  var first=dayDiff(todayStr,dd[0]);win=Math.max(1,Math.min(7,first+1));
  var rc=dd.filter(function(d){var x=dayDiff(todayStr,d);return x>=0&&x<win}).length;
  cur=rc/win;
 }
 h+='<div class="card"><h2>Pace</h2>';
 if(rem===0){h+='<div class="big">All done 🎉</div>'}
 else{
  var avail=dl===null?null:Math.max(dl,1);
  h+='<div class="kv"><span>Required per day</span><b>'+(avail?fmt(Math.round(rem/avail*10)/10)+' items':'set deadline')+'</b></div>';
  h+='<div class="kv"><span>Current pace (last '+win+'d)</span><b>'+(dd.length?fmt(Math.round(cur*10)/10)+' items/day':'no data yet')+'</b></div>';
  if(cur>0){
   var need=Math.ceil(rem/cur);
   h+='<div class="kv"><span>Projected finish</span><b>'+pretty(addDays(todayStr,need))+'</b></div>';
   if(avail!==null){
    var sp=dl-need,ex=need-Math.max(dl,0);
    if(dl>=0&&need<=dl)h+='<div class="big">✅ On track — ~'+sp+' day'+(sp===1?'':'s')+' to spare</div>';
    else h+='<div class="big bad">⚠️ Behind — need ~'+ex+' extra day'+(ex===1?'':'s')+' at this pace</div>';
   }
  }
 }
 h+='</div><div class="card"><h2>Subject-wise</h2>';
 S.subjects.forEach(function(s){
  var ls=[];s.topics.forEach(function(t){leafList(t).forEach(function(x){ls.push(x)})});
  var n=ls.length,d=ls.filter(function(x){return x.done}).length,r=ls.filter(function(x){return x.revs&&x.revs.length}).length;
  var p=n?Math.round(d/n*100):0;
  h+='<div class="hrow"><div class="d">'+esc(s.name)+'<small>'+d+' done · '+(n-d)+' left · '+r+' revised</small><div class="pb"><i style="width:'+p+'%"></i></div></div><div class="s" style="font-size:17px">'+p+'%</div></div>';
 });
 h+='</div>';
 var tr=L.reduce(function(a,l){return a+(l.it.revs?l.it.revs.length:0)},0),rv=L.filter(function(l){return l.it.revs&&l.it.revs.length}).length;
 h+='<div class="card"><h2>Revision</h2><div class="kv"><span>Items revised at least once</span><b>'+rv+' / '+done+' done</b></div><div class="kv"><span>Total revisions</span><b>'+tr+'</b></div></div>';
 return h;
}

function itemRow(s,t,u,x,indent){
 var rc=x.revs?x.revs.length:0,ids='data-s="'+s.id+'" data-t="'+t.id+'"'+(u?' data-u="'+u.id+'"':'');
 return '<div class="trow'+(indent?' srow':'')+'"><input type="checkbox" class="cb" data-a="tick" '+ids+(x.done?' checked':'')+'><div class="tn"><div'+(x.done?' style="text-decoration:line-through;color:var(--mut)"':'')+'>'+esc(x.name)+'</div><small>'+(x.done?'Done '+pretty(x.done):'Pending')+(rc?' · Revised ×'+rc+' (last '+pretty(x.revs[rc-1])+')':'')+'</small></div>'+
  (x.done?'<button class="sbtn" data-a="rev" '+ids+'>+R</button>':'')+(rc?'<button class="sbtn" data-a="unrev" '+ids+'>−R</button>':'')+
  (indent?'':'<button class="sbtn" data-a="addsubs" '+ids+'>＋Sub</button>')+
  '<button class="sbtn" data-a="edt" '+ids+'>✎</button><button class="sbtn" data-a="del" '+ids+'>✕</button></div>';
}

  if(!s.topics.length)h+='<div class="hint" style="padding:4px 0">No topics yet.</div>';
  s.topics.forEach(function(t){
   if(t.subs&&t.subs.length){

    t.subs.forEach(function(u){h+=itemRow(s,t,u,u,true)});
   }else h+=itemRow(s,t,null,t,false);
  });
  h+='<div style="display:flex;gap:8px;margin-top:8px"><input class="tin" placeholder="Add a topic" id="nt_'+s.id+'"><button class="sbtn ok" data-a="addt" data-s="'+s.id+'">Add</button></div></div>';
 });

}

function pLog(){
 var m={};
 leaves().forEach(function(l){
  if(l.it.done){(m[l.it.done]=m[l.it.done]||{c:[],r:[]}).c.push(lname(l))}
  (l.it.revs||[]).forEach(function(d){(m[d]=m[d]||{c:[],r:[]}).r.push(lname(l))});
 });
 var ds=Object.keys(m).sort().reverse();
 if(!ds.length)return '<div class="empty">Nothing logged yet. Tick topics in the Topics tab.</div>';
 return ds.map(function(d){
  var o=m[d];
  return '<div class="card"><h2>'+pretty(d)+' · '+o.c.length+' done'+(o.r.length?' · '+o.r.length+' revised':'')+'</h2>'+
   o.c.map(function(x){return '<div class="li">✅ '+esc(x)+'</div>'}).join('')+
   o.r.map(function(x){return '<div class="li">🔁 '+esc(x)+'</div>'}).join('')+'</div>';
 }).join('');
}

function render(){
 var h='<div class="tabs" style="padding:0 12px">'+
  [['prog','Progress'],['topics','Topics'],['log','Log']].map(function(x){return '<button class="tab'+(sub===x[0]?' on':'')+'" data-sub="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>';
 h+=sub==='prog'?pProg():sub==='topics'?pTopics():pLog();
 el.innerHTML=h;
}
function done(){sv();render()}
function mk(n){return {id:uid(),name:n,done:null,revs:[]}}

el.addEventListener('click',function(e){
 var b=e.target.closest('[data-sub]');
 if(b){sub=b.getAttribute('data-sub');render();return}
 var a=e.target.closest('[data-a]');if(!a)return;
 var act=a.getAttribute('data-a'),sid=a.getAttribute('data-s'),tid=a.getAttribute('data-t'),uidd=a.getAttribute('data-u');
 var s=sid?findS(sid):null,t=(s&&tid)?findT(s,tid):null,u=(t&&uidd)?findU(t,uidd):null,x=u||t;
 if(act==='tick'||act==='tickt')return;
 if(act==='preset'){dlg({title:'Load Anatomy, Physiology and Biochemistry syllabus?',ok:'Load',cb:doPreset})}
 else if(act==='cldl'){S.deadline='';done()}
 else if(act==='addsub'){var n=document.getElementById('newsub').value.trim();if(!n)return;S.subjects.push({id:uid(),name:n,topics:[]});done()}
 else if(act==='delsub'){dlg({title:'Delete "'+s.name+'" and all its topics?',ok:'Delete',danger:true,cb:function(){S.subjects=S.subjects.filter(function(q){return q.id!==sid});done()}})}
 else if(act==='rensub'){dlg({title:'Rename subject',input:true,value:s.name,cb:function(v){s.name=v.trim();done()}})}
 else if(act==='addt'){var i=document.getElementById('nt_'+sid),v=i.value.trim();if(!v)return;s.topics.push(mk(v));done()}
 else if(act==='bulk'){
  var bs=findS(document.getElementById('bsub').value);
  document.getElementById('bulk').value.split('\n').forEach(function(l){l=l.trim();if(l)bs.topics.push(mk(l))});done();
 }
 else if(act==='addsubs'){
  dlg({title:'Add subtopics to "'+t.name+'" (one per line)',input:true,area:true,ok:'Add',ph:'Subtopic 1\nSubtopic 2',cb:function(v){
   var ls=v.split('\n').map(function(z){return z.trim()}).filter(Boolean);
   if(!t.subs)t.subs=[];
   if(!t.subs.length&&t.done){ /* topic was already done: keep its status on new subtopics' parent by marking them done too */
    ls.forEach(function(z){var o=mk(z);o.done=t.done;t.subs.push(o)});
   }else ls.forEach(function(z){t.subs.push(mk(z))});
   done();
  }});
 }
 else if(act==='rev'){x.revs=x.revs||[];x.revs.push(logDate);x.revs.sort();done()}
 else if(act==='unrev'){if(x.revs&&x.revs.length)x.revs.pop();done()}
 else if(act==='edt'){dlg({title:'Rename',input:true,value:x.name,cb:function(v){x.name=v.trim();done()}})}
 else if(act==='del'){dlg({title:'Delete "'+x.name+'"'+((!u&&t.subs&&t.subs.length)?' and its subtopics':'')+'?',ok:'Delete',danger:true,cb:function(){
  if(u)t.subs=t.subs.filter(function(q){return q.id!==uidd});else s.topics=s.topics.filter(function(q){return q.id!==tid});
  done();
 }})}
});
el.addEventListener('change',function(e){
 var x=e.target;
 if(x.id==='sdl'){S.deadline=x.value;done();return}
 if(x.id==='ldate'){if(x.value)logDate=x.value;render();return}
 var a=x.getAttribute&&x.getAttribute('data-a');
 if(a==='tick'||a==='tickt'){
  var s=findS(x.getAttribute('data-s')),t=findT(s,x.getAttribute('data-t')),uu=x.getAttribute('data-u');
  if(a==='tickt'){t.subs.forEach(function(q){q.done=x.checked?(q.done||logDate):null})}
  else{var it=uu?findU(t,uu):t;it.done=x.checked?logDate:null}
  done();
 }
});

function homeOf(i){return i.orig||i.date}
function itemFrac(i){return (i.subs&&i.subs.length)?i.subs.filter(function(u){return u.done}).length/i.subs.length:(i.done?1:0)}
function planCalc(){
 var days={};
 planItems().forEach(function(i){var h=homeOf(i);if(h>=CATCH)return;var o=days[h]||(days[h]={n:0,fs:0});o.n++;o.fs+=itemFrac(i)});
 var ks=Object.keys(days),nd=ks.length,pct=0;
 ks.forEach(function(k){pct+=days[k].fs/days[k].n/nd});
 return {pct:pct,days:days,nd:nd||1};
}

function pProg(){

function pLog(){
 var m={};
 leaves().forEach(function(l){
  if(l.it.done){(m[l.it.done]=m[l.it.done]||{c:[],r:[]}).c.push(lname(l))}
  (l.it.revs||[]).forEach(function(d){(m[d]=m[d]||{c:[],r:[]}).r.push(lname(l))});
 });
 planItems().forEach(function(i){
  if(i.subs&&i.subs.length){i.subs.forEach(function(u){if(u.done){(m[u.done]=m[u.done]||{c:[],r:[]}).c.push('📋 '+(i.subj||'Other')+' — '+i.name+' › '+u.name)}})}
  else if(i.done){(m[i.done]=m[i.done]||{c:[],r:[]}).c.push('📋 '+(i.subj||'Other')+' — '+i.name)}
 });
 var ds=Object.keys(m).sort().reverse();
 if(!ds.length)return '<div class="empty">Nothing logged yet. Tick topics in the Topics or Plan tab.</div>';
 return ds.map(function(d){
  var o=m[d];
  return '<div class="card"><h2>'+pretty(d)+' · '+o.c.length+' done'+(o.r.length?' · '+o.r.length+' revised':'')+'</h2>'+
   o.c.map(function(x){return '<div class="li">✅ '+esc(x)+'</div>'}).join('')+
   o.r.map(function(x){return '<div class="li">🔁 '+esc(x)+'</div>'}).join('')+'</div>';
 }).join('');
}

 var last='';try{last=localStorage.getItem('mc100bk')||''}catch(e){}
 var d=document.createElement('div');d.className='ovl';
 d.innerHTML='<div class="dlg" style="max-height:90vh;overflow:auto"><h3>Backup</h3><div class="hint" style="padding:0 0 8px">Copy this code and keep it in Notes or a message to yourself.'+(last?' Last copied: '+esc(last):'')+'</div><textarea id="bkt" rows="4" class="tin" readonly></textarea><div class="acts" style="justify-content:flex-start"><button class="sbtn ok" id="bkc">Copy code</button><span id="bkn" style="font-size:12px;color:var(--mut);align-self:center"></span></div><h3 style="margin-top:16px">Restore</h3><div class="hint" style="padding:0 0 8px">Paste a backup code. This replaces the data currently in the app.</div><textarea id="rst" rows="4" class="tin" placeholder="Paste backup code here"></textarea><div id="bkm" style="font-size:12px;margin-top:6px;color:var(--bad)"></div><div class="acts"><button class="sbtn" id="bkx">Close</button><button class="sbtn dng" id="bkr">Restore</button></div></div>';
 document.body.appendChild(d);
 var t=d.querySelector('#bkt');t.value=code;
 function close(){document.body.removeChild(d)}
 d.querySelector('#bkx').onclick=close;
 d.addEventListener('click',function(e){if(e.target===d)close()});
 d.querySelector('#bkc').onclick=function(){
  var n=d.querySelector('#bkn'),ok=false;
  function done2(){
   n.textContent='Copied ✓';
   try{localStorage.setItem('mc100bk',new Date().toLocaleString())}catch(e){}
  }
  function manual(){t.focus();t.select();try{ok=document.execCommand('copy')}catch(e){}
   if(ok)done2();else n.textContent='Select the text above and copy it manually'}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done2,manual)}else manual();
 };
 d.querySelector('#bkr').onclick=function(){
  var m=d.querySelector('#bkm'),o;
  try{o=JSON.parse(d.querySelector('#rst').value.trim())}catch(e){m.textContent='That does not look like a valid backup code.';return}
  if(!o||typeof o!=='object'||!o.db||typeof o.db!=='object'||!o.syl||!Array.isArray(o.syl.subjects)){m.textContent='That does not look like a valid backup code.';return}
  db=o.db;save();S=o.syl;sv();close();
  if(!document.getElementById('syl').classList.contains('hidden'))render();
  load();
  if(!document.getElementById('hist').classList.contains('hidden'))renderHist();
 };
}
document.getElementById('bk').onclick=openBackup;

/* ===== auto-setup on a fresh/empty app ===== */
(function(){
 if(S.seeded)return;
 S.seeded=1;
 if(S.subjects.length||planItems().length){sv();return}
 PRESET.forEach(function(p){
  var sj={id:uid(),name:p[0],topics:[]};
  p[1].forEach(function(n){sj.topics.push(mk(n))});
  S.subjects.push(sj);
 });
 S.plan={items:PLAN.map(function(q){return {id:uid(),date:q[0],name:q[1],subj:q[2],done:null}})};
 S.deadline='2026-10-20';S.scope='plan';
 sv();
})();

/* ===== one-time best-effort restore: plan topics up to 15 Oct marked done on their planned day ===== */
(function(){
 if(S.restore1)return;
 S.restore1=1;
 planItems().forEach(function(i){
  if(i.date>='2026-10-13'&&i.date<='2026-10-15'&&!(i.subs&&i.subs.length)&&!i.done)i.done=i.date;
 });
 sv();
})();

window.show=function(w){
 ['entry','hist','syl'].forEach(function(k){document.getElementById(k).classList.toggle('hidden',k!==w)});
 document.getElementById('dates').classList.toggle('hidden',w!=='entry');
 document.getElementById('tEntry').classList.toggle('on',w==='entry');
 document.getElementById('tHist').classList.toggle('on',w==='hist');
 document.getElementById('tSyl').classList.toggle('on',w==='syl');
 if(w==='entry')load();else if(w==='hist')renderHist();else render();
 window.scrollTo(0,0);
};
document.getElementById('tSyl').onclick=function(){show('syl')};
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
